version: "3.8"

services:
  postgres:
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - civil_unrest_monitor_network

volumes:
  postgres_data:
    name: postgres_data_volume

networks:
  civil_unrest_monitor_network:
    name: civil_unrest_monitor_network
